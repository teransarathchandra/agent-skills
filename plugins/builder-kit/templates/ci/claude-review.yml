# Copy to .github/workflows/ to get @claude on PRs/issues. Setup: run /install-github-app in Claude Code,
# add ANTHROPIC_API_KEY as a repo secret (API key, not a subscription token). Advisory only - keep required checks as the gate.
name: claude
on:
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
concurrency: { group: claude-${{ github.event.issue.number || github.event.pull_request.number }}, cancel-in-progress: false }
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 15"
