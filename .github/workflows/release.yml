name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Validate
        run: |
          python scripts/validate_skills.py
          python -W error -m unittest discover -s tests
      - name: Check the tag matches plugin.json
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG notes for $VERSION" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
