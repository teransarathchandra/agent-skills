name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Validate skills and manifests
        run: python scripts/validate_skills.py
      - name: Run tests
        run: python -W error -m unittest discover -s tests
      - name: Run Node tests
        run: node --test tests/*.test.js

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check setup script syntax
        run: bash -n setup/install.sh && bash -n setup/uninstall.sh && bash -n setup/claude/hooks/ts-gate.sh && for f in plugins/*/scripts/verify.sh; do bash -n "$f"; done
      - name: Install Claude Code
        # Scripts stay off for every package; only Claude Code's own installer runs, to fetch its native binary.
        run: |
          npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.327
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
      - name: Validate the marketplace and every plugin (strict)
        run: claude plugin validate . --strict
